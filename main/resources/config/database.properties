# Database Configuration
# SQLite (default - no server required)
db.url=jdbc:sqlite:lms_database.db
db.driver=org.sqlite.JDBC

# Connection pool settings
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000

# Application settings
app.name=LMS Analytics Platform
app.version=1.0
app.defaultAdminUsername=admin
app.defaultAdminPassword=Admin@123
